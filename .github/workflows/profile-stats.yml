name: Atualizar estatísticas do perfil

on:
  workflow_dispatch:
  schedule:
    - cron: "21 8 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/profile_stats.py"
      - ".github/workflows/profile-stats.yml"
  pull_request:
    paths:
      - "README.md"
      - "scripts/profile_stats.py"
      - ".github/workflows/profile-stats.yml"
      - "tests/test_profile_cards.py"
      - "assets/*.svg"

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verificar SVG e cálculos sem acessar a rede
        run: python -m unittest discover -s tests -v

      - name: Gerar cartões pela API oficial do GitHub
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/profile_stats.py

      - name: Publicar SVGs no próprio repositório
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/top-languages.svg
          if git diff --cached --quiet; then
            echo "Estatísticas já atualizadas."
          else
            git commit -m "chore: atualizar estatísticas do perfil [skip ci]"
            git push
          fi
